spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fourcut?currentSchema=auth}
    username: ${DB_USERNAME:fourcut}
    password: ${DB_PASSWORD:fourcut}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:auth}
  flyway:
    default-schema: ${DB_SCHEMA:auth}
    schemas: ${DB_SCHEMA:auth}
    # 서비스마다 이력 테이블을 따로 둔다 (개발 DB는 여러 서비스가 스키마 하나를 함께 쓴다)
    table: flyway_history_auth
    # 이미 테이블이 있는 스키마(Crowfoot v17 반영본)에서는 V1을 건너뛰고 이력만 만든다
    baseline-on-migrate: true
    baseline-version: 1

auth:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  jwt-private-key: ${JWT_PRIVATE_KEY:}
  jwt-key-id: ${JWT_KEY_ID:}
  dev-login-enabled: ${AUTH_DEV_LOGIN_ENABLED:false}
  conversation-url: ${SERVICES_CONVERSATION_URL:http://localhost:8082}
  content-url: ${SERVICES_CONTENT_URL:http://localhost:8083}
  oauth:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}

server:
  port: ${PORT:8081}
  shutdown: graceful
  servlet:
    session:
      cookie:
        # 로그인 중 state 보관용 세션. web이 그대로 전달한다
        name: AUTH_LOGIN_SESSION
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
